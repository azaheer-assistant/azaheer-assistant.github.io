<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8b5a86"><title>أزاهير</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eee0ef;color:#684065;font:20px sans-serif;text-align:center}p{padding:24px}</style></head><body><p>جارٍ فتح أزاهير…</p><script>(async()=>{try{const parts=await Promise.all(Array.from({length:13},(_,i)=>fetch('./content-v6-'+i+'.txt',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('download');return r.text()})));const b=Uint8Array.from(atob(parts.map(s=>s.trim()).join('')),c=>c.charCodeAt(0));const s=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(s);document.close()}catch(e){document.body.innerHTML='<p>تعذّر فتح أزاهير. تحقّقي من اتصال الإنترنت واستخدمي نسخة حديثة من Chrome أو Safari، ثم أعيدي تحميل الصفحة.</p>'}})();</script></body></html>
